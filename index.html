<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cinematic Photo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  overflow:hidden;
}

/* WRAPPER */
.wrapper{
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* FOTO */
img{
  width:100vw;
  height:100vh;
  object-fit:cover;

  /* Cinematic zoom pelan */
  animation: zoomSlow 20s ease-in-out infinite alternate,
             fadeIn 1.5s ease;
}

/* ZOOM ANIMATION */
@keyframes zoomSlow{
  0%{
    transform: scale(1);
  }
  100%{
    transform: scale(1.1);
  }
}

/* FADE IN */
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

/* OPTIONAL: dark cinematic overlay */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.4),
    rgba(0,0,0,0.1)
  );
  pointer-events:none;
}
</style>

</head>
<body>

<div class="wrapper">
  <img src="couple.png" alt="foto cinematic">
</div>

<div class="overlay"></div>

</body>
</html>
